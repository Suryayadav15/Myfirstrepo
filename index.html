<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- A simple paragraph -->
    <p>This is a basic paragraph of text explaining what this page is about.</p>

    <!-- Subheading -->
    <h2>Key Features</h2>

    <!-- An unordered list (bullet points) -->
    <ul>
        <li>Easy to learn structure</li>
        <li>Accessible for all web browsers</li>
        <li>Supports text, images, and links</li>
    </ul>

    <!-- A hyperlink connecting to another site -->
    <p>Learn more by visiting the <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.</p>

    <!-- An image element -->
    <img src="https://unsplash.com" alt="Coding illustration" width="300">

</body>
</html>
